name: Validation System & Security

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir -r requirements-test.txt
          pip show mistralai

      - name: Run PowerShell Validation Script
        shell: pwsh
        run: |
          $scriptPath = "${{ github.workspace }}/.github/scripts/ci-validation.ps1"
          if (Test-Path $scriptPath) {
              Invoke-Expression "& `"$scriptPath`""
          } else {
              Write-Error "Le fichier ci-validation.ps1 est introuvable au chemin: $scriptPath."
              exit 1
          }

      - name: Run Tests (Pytest, no AI calls)
        run: |
          # tests/test_links.py is marked "integration" (live HTTP link-checks);
          # excluded here to keep CI fast and avoid flaky external dependencies.
          # No test calls a real Mistral or Anthropic API: session.py is imported
          # with a placeholder MISTRAL_API_KEY and Mistral.chat is mocked.
          pytest tests/ -m "not integration"
