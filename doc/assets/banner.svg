<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scientific English Agent banner">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#E8E0D0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9C6B4A"/>
      <stop offset="100%" stop-color="#C08552"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C7BBA5" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="url(#parchment)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="10" height="320" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="80" y="96" font-family="'DM Mono', 'Courier New', monospace" font-size="18" letter-spacing="4" fill="#9C6B4A">HIGHER EDUCATION · APC · CEFR B1–C2</text>

  <!-- title -->
  <text x="78" y="172" font-family="'Playfair Display', Georgia, serif" font-size="68" font-weight="700" fill="#2B2620">Scientific English Agent</text>

  <!-- subtitle -->
  <text x="80" y="218" font-family="'Spectral', Georgia, serif" font-size="26" fill="#5A5043">A competency-based AI agent harness for teaching scientific English</text>

  <!-- decorative molecule / node-link motif on the right -->
  <g stroke="#9C6B4A" stroke-width="2" fill="#C08552" opacity="0.85">
    <line x1="1060" y1="90"  x2="1140" y2="130"/>
    <line x1="1140" y1="130" x2="1120" y2="220"/>
    <line x1="1140" y1="130" x2="1210" y2="170"/>
    <line x1="1120" y1="220" x2="1190" y2="250"/>
    <line x1="1060" y1="90"  x2="1040" y2="180"/>
    <line x1="1040" y1="180" x2="1120" y2="220"/>
    <circle cx="1060" cy="90"  r="10"/>
    <circle cx="1140" cy="130" r="13"/>
    <circle cx="1210" cy="170" r="9"/>
    <circle cx="1120" cy="220" r="12"/>
    <circle cx="1190" cy="250" r="8"/>
    <circle cx="1040" cy="180" r="10"/>
  </g>

  <!-- bottom rule -->
  <rect x="80" y="252" width="640" height="2" fill="#C7BBA5"/>
  <text x="80" y="288" font-family="'DM Mono', monospace" font-size="15" letter-spacing="2" fill="#7A6F5E">6 AGENTS · 3 RUBRICS · 2 PROVIDERS · CLAUDE &amp; MISTRAL</text>
</svg>
